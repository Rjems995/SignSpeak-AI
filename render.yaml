services:
  - type: web
    name: signspeak-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app run init-db && gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: signspeak-db
          property: connectionString
databases:
  - name: signspeak-db
    plan: free
    databaseName: signspeak
    user: signspeak
